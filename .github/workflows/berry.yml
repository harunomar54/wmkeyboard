name: Berry build

# Builds the Berry fork (BlackBerry swipes, spacebar correction, fixed debug
# key, .berry app id) into an installable APK.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew assembleEnDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: berry-apk
          path: app/build/outputs/apk/en/debug/*.apk
          retention-days: 14

      - name: Unit tests for the Berry code
        continue-on-error: true
        run: ./gradlew :feature:ime:testDebugUnitTest --tests '*BerrySwipeTest' --tests '*OctopusFlickKeysTest' --tests '*OctopusFlickTest'
