name: Berry data

# One-off data jobs for the BB-Keyboard fork that need the open internet,
# which the build machines have. Nothing here touches the app or its build.
on:
  workflow_dispatch:

jobs:
  name-capitals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AOSP's English word list
        run: |
          curl -fsSL "https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/refs/heads/main/dictionaries/en_US_wordlist.combined.gz?format=TEXT" \
            | base64 -d | gunzip > en_US.combined
          head -3 en_US.combined
          wc -l en_US.combined
      - name: List names written mostly with a capital
        run: |
          python3 berry/tools/name_capitals.py en_US.combined app/dictionaries-src/en.txt \
            app/src/main/assets/dictionaries/en_caps.txt > name-capitals.tsv
          wc -l name-capitals.tsv
          cat name-capitals.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: name-capitals
          path: name-capitals.tsv

  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AOSP's English word list and the US baby names (CRAN)
        run: |
          curl -fsSL "https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/refs/heads/main/dictionaries/en_US_wordlist.combined.gz?format=TEXT" \
            | base64 -d | gunzip > en_US.combined
          # The US Social Security baby name counts (1880-2017) as CRAN's
          # babynames package publishes them.
          curl -fsSL -o babynames.tar.gz https://cran.r-project.org/src/contrib/babynames_1.0.1.tar.gz \
            || curl -fsSL -o babynames.tar.gz https://cran.r-project.org/src/contrib/Archive/babynames/babynames_1.0.1.tar.gz
          tar xzf babynames.tar.gz
          pip install --quiet pyreadr pandas
          mkdir ssa
          python3 berry/tools/babynames_totals.py babynames/data/babynames.rda ssa/yob2017.txt
          wc -l ssa/yob2017.txt
      - name: Build the name capitals
        run: |
          python3 berry/tools/build_names.py en_US.combined ssa app/dictionaries-src/en.txt \
            app/src/main/assets/dictionaries/en_caps.txt berry/names/arabic_names.txt \
            berry/names/exclude.txt out
          wc -l out/*
          echo "-----BEGIN NAMES-----"
          tar czf - -C out . | base64 -w0
          echo
          echo "-----END NAMES-----"
      - uses: actions/upload-artifact@v4
        with:
          name: names
          path: out/
